<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartless IPTV Play</title>
    <style>
        :root {
            --bg-color: #0f0f15;
            --container-bg: #1a1a24;
            --accent-color: #ff3b30;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --card-bg: #242432;
            --card-hover: #2d2d3f;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: var(--container-bg);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--accent-color);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        header span {
            color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin: 30px auto;
        }

        .player-section {
            background-color: var(--container-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background-color: #000;
        }

        .video-container iframe, .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .now-playing {
            margin-top: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        .now-playing span {
            color: var(--accent-color);
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .channel-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .channel-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            background-color: #1a1a24;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .channel-name {
            font-size: 15px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Heartless <span>IPTV</span> Player</h1>
    </header>

    <div class="container">
        <div class="player-section">
            <div class="video-container">
                <iframe id="live-player" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
            <div class="now-playing">Now Playing: <span id="current-channel">Select a Channel</span></div>
        </div>

        <h2 style="margin-bottom: 20px; font-size: 20px; border-left: 4px solid var(--accent-color); padding-left: 10px;">Channels</h2>
        <div class="channel-grid">
            
            <div class="channel-card" onclick="changeChannel('Somoy TV Live', 'https://www.youtube.com/live/ftQbYwVc8bA?si=jBNkBYjZjuurPpxh')">
                <div class="channel-logo">STV</div>
                <div class="channel-name">Somoy TV Live</div>
            </div>

            <div class="channel-card" onclick="changeChannel('Jamuna TV Live', 'https://www.youtube.com/embed/live_stream?channel=UCs9_9p_I66Sxy4Cq7sh8T9g')">
                <div class="channel-logo">JTV</div>
                <div class="channel-name">Jamuna TV</div>
            </div>

            <div class="channel-card" onclick="changeChannel('Independent TV', 'https://www.youtube.com/embed/live_stream?channel=UCc1eNfS8_Vat9bV800F6Iig')">
                <div class="channel-logo">ITV</div>
                <div class="channel-name">Independent TV</div>
            </div>

            <div class="channel-card" onclick="changeChannel('Channel 24', 'https://www.youtube.com/embed/live_stream?channel=UCpHeC_vCgQZas3Q9g6Lre3g')">
                <div class="channel-logo">C24</div>
                <div class="channel-name">Channel 24</div>
            </div>

        </div>
    </div>

    <script>
        function changeChannel(name, url) {
            document.getElementById('current-channel').innerText = name;
            document.getElementById('live-player').src = url;
        }
    </script>

</body>
</html>
